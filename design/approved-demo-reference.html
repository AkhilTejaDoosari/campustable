size:11px;padding:8px 10px}.draftbar{flex-wrap:wrap}.side h1{font-size:30px}.notice{font-size:10px}.btn{padding:11px 17px}}\n@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}\n\n.preview-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;background:#f3eafd;border:1px solid #e1cfee;border-radius:14px;margin-bottom:20px}.preview-toolbar p{margin:0;font-size:11px;color:#765987}.step-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.step-tab{flex:1;min-width:75px;border:1px solid #e0d3eb;border-radius:11px;background:#fff;color:#79618d;padding:10px 7px;font-size:10px;text-align:center}.step-tab strong{display:block;font-size:14px;margin-bottom:2px}.step-tab[aria-current=step]{border-color:#7541e9;background:#f0e5ff;color:#6637b2}.preview-jump-note{font-size:10px;color:#8b7698;margin:0 0 18px}.preview-toolbar .btn{padding:9px 13px;font-size:11px}@media(max-width:500px){.preview-toolbar{align-items:start;flex-direction:column}.step-tabs{gap:5px}.step-tab{min-width:0;padding:9px 3px;font-size:9px}.step-tab strong{font-size:12px}}\n\n.date-picker,.skill-picker{position:relative}.date-trigger{color:var(--ink);width:100%;text-align:left;background:white;border:1px solid #d7d4df;border-radius:12px;padding:13px 14px;font:inherit;display:flex;justify-content:space-between;align-items:center}.date-panel,.skill-panel{background:white;border:1px solid #ddd7ed;border-radius:14px;padding:14px;margin-top:8px;box-shadow:0 8px 24px #35236a12}.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.month-grid button,.skill-choice{color:var(--ink);font:inherit;border:0;border-radius:8px;background:#f5f2fc;padding:10px;cursor:pointer}.month-grid button[aria-pressed=true]{background:#6d42db;color:white}.skill-options{max-height:220px;overflow:auto;display:grid;gap:5px}.skill-choice{text-align:left;display:flex;gap:10px;align-items:center;background:white}.skill-choice:hover,.skill-choice:focus-visible{background:#f1ebfc}.skill-choice[aria-pressed=true]{background:#eee6ff;color:#5225af}.skill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;background:#f5f1fc;border-radius:12px}.skill-chip{display:inline-flex;gap:10px;align-items:center;color:#5225af;font-weight:700;flex:1}.skill-remove{border:0;background:transparent;color:#5225af;font:inherit;cursor:pointer;padding:4px 8px}.skill-row select{width:auto;min-width:150px;flex:1}.skill-panel p{margin:8px 0}.skill-toggle{margin-top:8px}.date-panel[hidden],.skill-panel[hidden]{display:none}button:focus-visible{outline:3px solid #ae93ee;outline-offset:3px}\n.role-picker{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}.role-picker .option{flex:1;justify-content:center;font-weight:650}.switch-role{color:var(--purple);background:#f2eafe;border:1px solid #d4bee6;border-radius:10px;padding:8px 12px;font:inherit;margin-top:10px}.faculty-panel{margin-top:18px}.status-note{font-size:12px;color:var(--muted)} \u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"notice\">Community setup \u00b7 Interactive design preview \u00b7 Use sample details only \u00b7 No real verification or uploads\u003c/div>\n\u003cheader class=\"top\">\u003ca class=\"brand\" href=\"campustable-hero.html\" aria-label=\"CampusTable home\">\u003csvg viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003cellipse cx=\"20\" cy=\"20\" rx=\"18\" ry=\"10\" transform=\"rotate(-35 20 20)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\"/>\u003cellipse cx=\"20\" cy=\"20\" rx=\"18\" ry=\"10\" transform=\"rotate(35 20 20)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\"/>\u003ccircle cx=\"20\" cy=\"20\" r=\"4\" fill=\"currentColor\"/>\u003c/svg>CampusTable\u003c/a>\u003cspan>Student profile \u00b7 Preview 01\u003c/span>\u003c/header>\n\u003cmain class=\"layout\">\u003caside class=\"side\">\u003cdiv class=\"eyebrow\">A place for your next idea\u003c/div>\u003ch1>Your people.\u003cbr>Your possibilities.\u003c/h1>\u003cp>Join a community of students, alumni, and faculty. Find people to learn with, help, and build alongside.\u003c/p>\u003cdiv class=\"orbit\" aria-hidden=\"true\">\u003cdiv class=\"circle\">\u003c/div>\u003cdiv class=\"circle two\">\u003c/div>\u003cdiv class=\"center\">\u2726\u003c/div>\u003cdiv class=\"orb a\">?\u003c/div>\u003cdiv class=\"orb b\">\u2197\u003c/div>\u003cdiv class=\"orb c\">\u25ce\u003c/div>\u003c/div>\u003cp class=\"tip\">You don't need to have it all figured out. A learning goal is a perfectly good place to start.\u003c/p>\u003cdetails class=\"prototype-controls\">\u003csummary>Preview controls\u003c/summary>\u003cp>These controls are for design review, not part of the alumni form.\u003c/p>\u003clabel for=\"scenario\">University verification scenario\u003c/label>\u003cselect id=\"scenario\">\u003coption value=\"normal\">Recognized university\u003c/option>\u003coption value=\"invalid\">Invalid OTP\u003c/option>\u003coption value=\"expired\">Expired OTP\u003c/option>\u003coption value=\"linked\">Email linked to another account\u003c/option>\u003coption value=\"unknown\">Unknown university domain\u003c/option>\u003coption value=\"unavailable\">Email service unavailable\u003c/option>\u003c/select>\u003cbutton class=\"btn secondary\" id=\"fill-sample\" style=\"margin-top:12px\">Use sample details\u003c/button>\u003cbutton class=\"btn text\" id=\"reset\" style=\"margin-top:8px;display:block\">Reset preview and saved draft\u003c/button>\u003cp>Demo verification code: \u003cstrong>123456\u003c/strong>. Save and Continue Later stores form text in this browser. OTPs and file contents are not saved.\u003c/p>\u003c/details>\u003c/aside>\n\u003cdiv class=\"card\">\u003cdiv class=\"preview-toolbar\">\u003cp>\u003cstrong>Explore the design\u003c/strong>\u003cbr>Jump to any step below, or load sample details to try Continue.\u003c/p>\u003cbutton type=\"button\" class=\"btn secondary\" id=\"quick-sample\">Use sample details\u003c/button>\u003c/div>\u003cdiv id=\"draftbar\" class=\"draftbar\" hidden>\u003cspan>There is a saved draft in this browser.\u003c/span>\u003cbutton class=\"btn secondary\" id=\"resume-draft\">Resume draft\u003c/button>\u003c/div>\u003cdiv id=\"wizard\">\u003cnav class=\"step-tabs\" aria-label=\"Preview setup steps\">\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"0\">\u003cstrong>1\u003c/strong>Account\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"1\">\u003cstrong>2\u003c/strong>Academic\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"2\">\u003cstrong>3\u003c/strong>Goals\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"3\">\u003cstrong>4\u003c/strong>Availability\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"4\">\u003cstrong>5\u003c/strong>Review\u003c/button>\u003c/nav>\u003cp class=\"preview-jump-note\">Step buttons skip validation for design review only. Continue checks the form.\u003c/p>\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003cdiv class=\"step-label\" id=\"step-label\">\u003c/div>\u003cdiv id=\"global-error\" class=\"status error\" role=\"alert\" tabindex=\"-1\" hidden>\u003c/div>\u003cform novalidate id=\"setup\" novalidate>\u003cfieldset class=\"role-picker\">\u003clegend>Join Community \u00b7 I am a\u003c/legend>\u003cdiv class=\"options\">\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"community-role\" value=\"student\" checked>Current Student\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"community-role\" value=\"alumni\">Alumni\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"radio\" name=\"community-role\" value=\"faculty\">Faculty\u003c/label>\u003c/div>\u003cp class=\"hint\">Choose your role. Your shared details stay here when you switch.\u003c/p>\u003c/fieldset>\n\u003csection class=\"step\" data-step=\"0\">\u003ch2>Join your community.\u003c/h2>\u003cp class=\"subtitle\">Use a personal email you can keep. University verification requirements change with your selected role.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"first\">First Name *\u003c/label>\u003cinput id=\"first\" required autocomplete=\"given-name\">\u003c/div>\u003cdiv>\u003clabel for=\"last\">Last Name *\u003c/label>\u003cinput id=\"last\" required autocomplete=\"family-name\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"personal\">Personal Email *\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"personal\" type=\"email\" required autocomplete=\"email\">\u003cbutton type=\"button\" class=\"btn secondary send\" data-email=\"personal\">Send code\u003c/button>\u003c/div>\u003cspan id=\"personal-badge\" class=\"badge\" hidden>Personal email verified \u00b7 simulated\u003c/span>\u003cdiv id=\"personal-otp\" class=\"otp\" hidden>\u003clabel for=\"personal-code\">Verification Code\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"personal-code\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"123456\">\u003cbutton type=\"button\" class=\"btn secondary verify\" data-email=\"personal\">Verify\u003c/button>\u003c/div>\u003c/div>\u003cp id=\"personal-status\" class=\"local-error\" role=\"status\">\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"status-note\" id=\"verification-guidance\">\u003c/p>\u003cdiv class=\"block\" id=\"email-path\">\u003clabel for=\"school\">University Email \u003cspan id=\"school-required\">*\u003c/span>\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"school\" type=\"email\" placeholder=\"Your active university or alumni email\">\u003cbutton type=\"button\" class=\"btn secondary send\" data-email=\"school\">Send code\u003c/button>\u003c/div>\u003cspan id=\"school-badge\" class=\"badge\" hidden>\u003c/span>\u003cdiv id=\"school-otp\" class=\"otp\" hidden>\u003clabel for=\"school-code\">Verification Code\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"school-code\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"123456\">\u003cbutton type=\"button\" class=\"btn secondary verify\" data-email=\"school\">Verify\u003c/button>\u003c/div>\u003c/div>\u003cp id=\"school-status\" class=\"local-error\" role=\"status\">\u003c/p>\u003cp class=\"hint\" id=\"school-explanation\">\u003c/p>\u003cdiv id=\"institution\" hidden class=\"status\">Example University \u00b7 simulated domain match\u003c/div>\u003cdiv id=\"unknown-fields\" hidden>\u003cp class=\"hint\">This domain needs institution review. Your profile will stay pending.\u003c/p>\u003clabel for=\"new-university\">University Name *\u003c/label>\u003cinput id=\"new-university\">\u003clabel for=\"new-website\">Official University Website *\u003c/label>\u003cinput id=\"new-website\" type=\"url\">\u003c/div>\u003c/div>\u003cdetails class=\"block\" id=\"evidence-path\" hidden>\u003csummary>Graduation evidence \u00b7 Optional\u003c/summary>\u003ch3>Request graduation review\u003c/h3>\u003cp>Prefer an issuer-verifiable credential or university verification link. Otherwise, submit a diploma, degree certificate, or transcript that shows a degree awarded.\u003c/p>\u003clabel for=\"credential-url\">Credential / University Verification Link\u003c/label>\u003cinput id=\"credential-url\" type=\"url\" placeholder=\"https://\u2026\">\u003cdiv class=\"divider\">\u003c/div>\u003clabel for=\"evidence-file\">Graduation Document\u003c/label>\u003cinput id=\"evidence-file\" type=\"file\" accept=\".pdf,.png,.jpg,.jpeg\">\u003cp id=\"evidence-name\" class=\"hint\">No document selected.\u003c/p>\u003cbutton type=\"button\" class=\"btn text\" id=\"demo-evidence\">Use sample graduation document\u003c/button>\u003cp class=\"hint\">Keep your name, institution, degree and award date visible. You may redact grades, student numbers and unrelated personal information. No government ID or selfie is required.\u003c/p>\u003cp class=\"hint\">Preview: PDF, PNG or JPG, up to 5 MB. Nothing is uploaded or saved.\u003c/p>\u003cdiv class=\"status warn\">You can join without this document. Submitted evidence stays pending until reviewed and never automatically grants a verified graduation badge.\u003c/div>\u003c/details>\u003c/section>\n\u003csection class=\"step\" data-step=\"1\" hidden>\u003ch2 id=\"academic-heading\">Your academic information.\u003c/h2>\u003cp class=\"subtitle\">Tell us about your background. Only fields relevant to your role appear.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"full\">\u003clabel for=\"university\">University *\u003c/label>\u003cinput id=\"university\" required list=\"universities\" placeholder=\"Search or enter your university\">\u003cdatalist id=\"universities\">\u003coption>Example University\u003c/option>\u003c/datalist>\u003cp class=\"hint\">All participating universities are welcome. If yours is missing, enter its official name and website for institution review.\u003c/p>\u003clabel for=\"university-website\">Official University Website *\u003c/label>\u003cinput id=\"university-website\" type=\"url\" required placeholder=\"https://your-university.edu\">\u003c/div>\u003cdiv class=\"full degree-field\">\u003clabel for=\"degree\">Degree Level *\u003c/label>\u003cselect id=\"degree\" required>\u003coption value=\"\">Select degree level\u003c/option>\u003coption>Associate Degree\u003c/option>\u003coption>Bachelor's Degree\u003c/option>\u003coption>Master's Degree\u003c/option>\u003coption>Doctoral Degree\u003c/option>\u003coption>Certificate\u003c/option>\u003coption>Other\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"degree-other-wrap\" class=\"full degree-field\" hidden>\u003clabel for=\"degree-other\">Degree Name *\u003c/label>\u003cinput id=\"degree-other\">\u003c/div>\u003cdiv class=\"full degree-field\">\u003clabel for=\"major\">Major / Program *\u003c/label>\u003cinput id=\"major\" required list=\"programs\" placeholder=\"Search or enter your program\">\u003cdatalist id=\"programs\">\u003coption>Computer Science\u003c/option>\u003coption>Engineering\u003c/option>\u003coption>Business\u003c/option>\u003coption>Design\u003c/option>\u003coption>Data Science\u003c/option>\u003coption>Biology\u003c/option>\u003c/datalist>\u003cp class=\"hint\">Example suggestions. Actual programs will be institution-specific, with a custom entry option.\u003c/p>\u003c/div>\u003cdiv class=\"degree-field\">\u003clabel id=\"start-label\" for=\"start-trigger\">Program Start Date \u00b7 Optional\u003c/label>\u003cdiv class=\"date-picker\">\u003cinput id=\"start\" type=\"hidden\">\u003cbutton type=\"button\" id=\"start-trigger\" class=\"date-trigger\" aria-expanded=\"false\" aria-controls=\"start-calendar\">\u003cspan>Select month and year\u003c/span>\u003cspan aria-hidden=\"true\">\u25a6 \u25be\u003c/span>\u003c/button>\u003cdiv id=\"start-calendar\" class=\"date-panel\" hidden role=\"group\" aria-labelledby=\"start-label\">\u003clabel for=\"start-year\">Year\u003c/label>\u003cselect id=\"start-year\">\u003c/select>\u003cdiv class=\"month-grid\" id=\"start-months\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"full\" id=\"student-enrollment\">\u003clabel for=\"status\">Enrollment Status \u00b7 Optional\u003c/label>\u003cselect id=\"status\">\u003coption value=\"\">Select status\u003c/option>\u003coption>Full-time\u003c/option>\u003coption>Part-time\u003c/option>\u003coption>On leave\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"full\" id=\"grad-choice\">\u003clabel for=\"grad-type\">Expected Graduation *\u003c/label>\u003cselect id=\"grad-type\">\u003coption value=\"known\">I know my expected date\u003c/option>\u003coption value=\"unknown\">Date not yet known\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"grad-wrap\" class=\"full degree-field\">\u003clabel id=\"grad-label\" for=\"grad-trigger\">Expected Graduation Date *\u003c/label>\u003cdiv class=\"date-picker\">\u003cinput id=\"grad\" type=\"hidden\">\u003cbutton type=\"button\" id=\"grad-trigger\" class=\"date-trigger\" aria-expanded=\"false\" aria-controls=\"grad-calendar\">\u003cspan>Select month and year\u003c/span>\u003cspan aria-hidden=\"true\">\u25a6 \u25be\u003c/span>\u003c/button>\u003cdiv id=\"grad-calendar\" class=\"date-panel\" hidden role=\"group\" aria-labelledby=\"grad-label\">\u003clabel for=\"grad-year\">Year\u003c/label>\u003cselect id=\"grad-year\">\u003c/select>\u003cdiv class=\"month-grid\" id=\"grad-months\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"alumni-work\" class=\"fields\" style=\"margin-top:16px\">\u003cdiv>\u003clabel for=\"current-role\">Current Position \u00b7 Optional\u003c/label>\u003cinput id=\"current-role\" placeholder=\"Your current role\">\u003c/div>\u003cdiv>\u003clabel for=\"organization\">Organization \u00b7 Optional\u003c/label>\u003cinput id=\"organization\" placeholder=\"Company or organization\">\u003c/div>\u003c/div>\u003cdetails class=\"extra degree-field\">\u003csummary>Additional academic details \u00b7 Optional\u003c/summary>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"campus\">Campus\u003c/label>\u003cinput id=\"campus\" placeholder=\"Campus name\">\u003c/div>\u003cdiv>\u003clabel for=\"concentration\">Concentration / Specialization\u003c/label>\u003cinput id=\"concentration\">\u003c/div>\u003cdiv>\u003clabel for=\"minor\">Minor\u003c/label>\u003cinput id=\"minor\">\u003c/div>\u003cdiv>\u003clabel for=\"courses\">Relevant Courses\u003c/label>\u003cinput id=\"courses\" placeholder=\"Separate course names with commas\">\u003c/div>\u003c/div>\u003c/details>\u003cdiv id=\"faculty-fields\" class=\"faculty-panel\" hidden>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"department\">Department *\u003c/label>\u003cinput id=\"department\" list=\"departments\" placeholder=\"Search or enter your department\">\u003cdatalist id=\"departments\">\u003coption>Computer Science\u003c/option>\u003coption>Engineering\u003c/option>\u003coption>Business\u003c/option>\u003coption>Humanities\u003c/option>\u003coption>Biology\u003c/option>\u003c/datalist>\u003c/div>\u003cdiv>\u003clabel for=\"faculty-title\">Position / Title *\u003c/label>\u003cselect id=\"faculty-title\">\u003coption value=\"\">Select title\u003c/option>\u003coption>Professor\u003c/option>\u003coption>Associate Professor\u003c/option>\u003coption>Assistant Professor\u003c/option>\u003coption>Lecturer / Instructor\u003c/option>\u003coption>Adjunct Faculty\u003c/option>\u003coption>Visiting Faculty\u003c/option>\u003coption>Other\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"faculty-other-wrap\" class=\"full\" hidden>\u003clabel for=\"faculty-other\">Position / Title *\u003c/label>\u003cinput id=\"faculty-other\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"faculty-url\">Official University Profile\u003c/label>\u003cinput id=\"faculty-url\" type=\"url\" placeholder=\"Your faculty directory or university profile URL\">\u003clabel class=\"toggle\">\u003cinput id=\"no-directory\" type=\"checkbox\">My university has no public faculty profile; request affiliation review\u003c/label>\u003cp class=\"hint\">Provide a profile link or request review. University email access alone does not verify a faculty role.\u003c/p>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"faculty-help\">How I'd Like to Participate *\u003c/label>\u003ctextarea id=\"faculty-help\" placeholder=\"For example: advise student projects and offer research collaboration.\">\u003c/textarea>\u003c/div>\u003c/div>\u003cdiv class=\"status warn\">Faculty affiliation review required. Your profile stays inactive until the role is reviewed. This preview does not submit a review request.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"step\" data-step=\"2\" hidden>\u003ch2>What brings you here?\u003c/h2>\u003cp class=\"subtitle\">Complete at least one: a skill you can help with, a learning goal, or a project need. You don't need all three.\u003c/p>\u003cdiv class=\"block\">\u003ch3 id=\"offered-heading\">Skills I Can Help With \u003cspan class=\"required\">\u00b7 Optional\u003c/span>\u003c/h3>\u003cp>Share something you're comfortable helping someone with.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"full skill-picker\" data-skill=\"offered\">\u003cinput id=\"offered\" type=\"hidden\">\u003clabel for=\"offered-search\">Skills\u003c/label>\u003cinput id=\"offered-search\" placeholder=\"Search skills or add your own\" aria-controls=\"offered-options\" autocomplete=\"off\">\u003cbutton type=\"button\" class=\"btn secondary skill-toggle\" id=\"offered-toggle\" aria-expanded=\"false\" aria-controls=\"offered-panel\">Choose skills \u25be\u003c/button>\u003cdiv class=\"skill-panel\" id=\"offered-panel\" hidden>\u003cdiv class=\"skill-options\" id=\"offered-options\" role=\"group\" aria-label=\"Select multiple skills\">\u003c/div>\u003cp class=\"hint\">Choose as many as you like. Search to add a skill that isn't listed.\u003c/p>\u003c/div>\u003cdiv id=\"offered-selected\" aria-live=\"polite\">\u003c/div>\u003cp class=\"hint\">Select a skill level for each skill you add.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"block\">\u003ch3>Skills I Want to Learn \u003cspan class=\"required\">\u00b7 Optional\u003c/span>\u003c/h3>\u003cp>A specific goal makes it easier for someone to help.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"full skill-picker\" data-skill=\"wanted\">\u003cinput id=\"wanted\" type=\"hidden\">\u003clabel for=\"wanted-search\">Skills\u003c/label>\u003cinput id=\"wanted-search\" placeholder=\"Search skills or add your own\" aria-controls=\"wanted-options\" autocomplete=\"off\">\u003cbutton type=\"button\" class=\"btn secondary skill-toggle\" id=\"wanted-toggle\" aria-expanded=\"false\" aria-controls=\"wanted-panel\">Choose skills \u25be\u003c/button>\u003cdiv class=\"skill-panel\" id=\"wanted-panel\" hidden>\u003cdiv class=\"skill-options\" id=\"wanted-options\" role=\"group\" aria-label=\"Select multiple skills\">\u003c/div>\u003cp class=\"hint\">Choose as many as you like. Search to add a skill that isn't listed.\u003c/p>\u003c/div>\u003cdiv id=\"wanted-selected\" aria-live=\"polite\">\u003c/div>\u003cp class=\"hint\">Select a current skill level for each skill you add.\u003c/p>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"goal\">Learning Goal\u003c/label>\u003ctextarea id=\"goal\" placeholder=\"I want to design a clear interface for my first project.\">\u003c/textarea>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"block\">\u003ch3>A Project Need \u003cspan class=\"required\">\u00b7 Optional\u003c/span>\u003c/h3>\u003cp>Have something in mind? Tell people what you want to build.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"full\">\u003clabel for=\"project-title\">Project Title\u003c/label>\u003cinput id=\"project-title\" placeholder=\"Campus event finder\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"project-description\">What I Want to Build\u003c/label>\u003ctextarea id=\"project-description\">\u003c/textarea>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"project-help\">Help / Roles Needed\u003c/label>\u003cinput id=\"project-help\" placeholder=\"Design feedback and a frontend collaborator\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"project-status\">Project Status\u003c/label>\u003cselect id=\"project-status\">\u003coption>Planned\u003c/option>\u003coption>In progress\u003c/option>\u003coption>Completed\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003c/div>\u003cdatalist id=\"skills\">\u003coption>Python\u003c/option>\u003coption>UI design\u003c/option>\u003coption>Public speaking\u003c/option>\u003coption>Writing\u003c/option>\u003coption>Data analysis\u003c/option>\u003coption>Research\u003c/option>\u003c/datalist>\u003cfieldset>\u003clegend>Interested In * \u003cspan class=\"required\">Select at least one\u003c/span>\u003c/legend>\u003cdiv class=\"options\">\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"interests\" value=\"Learning a skill\">Learning a skill\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"interests\" value=\"Project teammates\">Project teammates\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"interests\" value=\"Helping others\">Helping others\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"interests\" value=\"Reviewing work\">Reviewing work\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"interests\" value=\"Mentoring\">Mentoring\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"interests\" value=\"Advising projects\">Advising projects\u003c/label>\u003c/div>\u003c/fieldset>\u003c/section>\n\u003csection class=\"step\" data-step=\"3\" hidden>\u003ch2>Make connecting easier.\u003c/h2>\u003cp class=\"subtitle\">Set your availability and add links when you're ready. No external account is required to join.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"availability\">Availability *\u003c/label>\u003cselect id=\"availability\" required>\u003coption value=\"\">Select availability\u003c/option>\u003coption>Available\u003c/option>\u003coption>Limited availability\u003c/option>\u003coption>Currently unavailable\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"meeting\">Meeting Preference *\u003c/label>\u003cselect id=\"meeting\" required>\u003coption value=\"\">Select preference\u003c/option>\u003coption>Online\u003c/option>\u003coption>In person\u003c/option>\u003coption>Either\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"scope\">University Preference *\u003c/label>\u003cselect id=\"scope\">\u003coption>My university\u003c/option>\u003coption>All participating universities\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"timezone\">Time Zone *\u003c/label>\u003cinput id=\"timezone\" required list=\"timezones\">\u003cdatalist id=\"timezones\">\u003coption>America/New_York\u003c/option>\u003coption>America/Chicago\u003c/option>\u003coption>America/Los_Angeles\u003c/option>\u003coption>Asia/Kolkata\u003c/option>\u003coption>Europe/London\u003c/option>\u003coption>UTC\u003c/option>\u003c/datalist>\u003cp class=\"hint\">Detected automatically; editable.\u003c/p>\u003c/div>\u003c/div>\u003cdetails class=\"extra\">\u003csummary>Weekly schedule \u00b7 Optional\u003c/summary>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"hours\">Hours Available Per Week\u003c/label>\u003cselect id=\"hours\">\u003coption value=\"\">Select hours\u003c/option>\u003coption>Less than 1 hour\u003c/option>\u003coption>1\u20133 hours\u003c/option>\u003coption>4\u20136 hours\u003c/option>\u003coption>7 or more hours\u003c/option>\u003coption>Varies\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"days\">Preferred Days\u003c/label>\u003cinput id=\"days\" placeholder=\"e.g. Monday, Wednesday\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"times\">Preferred Time\u003c/label>\u003cselect id=\"times\">\u003coption value=\"\">Select time\u003c/option>\u003coption>Morning\u003c/option>\u003coption>Afternoon\u003c/option>\u003coption>Evening\u003c/option>\u003coption>Flexible\u003c/option>\u003c/select>\u003c/div>\u003c/div>\u003c/details>\u003cdiv class=\"divider\">\u003c/div>\u003cdiv class=\"fields\">\u003cdiv class=\"full\">\u003clabel for=\"linkedin\">LinkedIn Profile \u003cspan class=\"required\">\u00b7 Recommended\u003c/span>\u003c/label>\u003cinput id=\"linkedin\" type=\"url\" placeholder=\"https://www.linkedin.com/in/your-profile\">\u003cp class=\"hint\">Don't have LinkedIn yet? Share your education, experience, and projects when you're ready. \u003ca href=\"https://www.linkedin.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Create Profile \u2197\u003c/a> \u00b7 You can add it later.\u003c/p>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"github\">GitHub Profile \u003cspan class=\"required\">\u00b7 Recommended for code-based work\u003c/span>\u003c/label>\u003cinput id=\"github\" type=\"url\" placeholder=\"https://github.com/your-profile\">\u003cp class=\"hint\">Working on software projects? GitHub helps you share code and contributions. \u003ca href=\"https://github.com/signup\" target=\"_blank\" rel=\"noopener noreferrer\">Create Profile \u2197\u003c/a> \u00b7 You can add it later.\u003c/p>\u003c/div>\u003c/div>\u003cdetails class=\"extra\">\u003csummary>Additional Profile Links \u00b7 Optional\u003c/summary>\u003cdiv class=\"fields\">\u003cdiv class=\"full\">\u003clabel for=\"handshake\">Other Link\u003c/label>\u003cinput id=\"handshake\" type=\"url\" placeholder=\"Shareable profile URL\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"indeed\">Second Other Link\u003c/label>\u003cinput id=\"indeed\" type=\"url\" placeholder=\"Shareable profile URL\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"portfolio\">Portfolio Website\u003c/label>\u003cinput id=\"portfolio\" type=\"url\" placeholder=\"https://your-website.example\">\u003c/div>\u003c/div>\u003cp class=\"hint\">Use links your intended audience can open. No profile imports or account linking.\u003c/p>\u003c/details>\u003c/section>\n\u003csection class=\"step\" data-step=\"4\" hidden>\u003ch2>Your profile. Your choice.\u003c/h2>\u003cp class=\"subtitle\">Choose who can view your profile, then review your information.\u003c/p>\u003clabel for=\"visibility\">Who Can View My Profile *\u003c/label>\u003cselect id=\"visibility\">\u003coption>Members at my university\u003c/option>\u003coption>Members at participating universities\u003c/option>\u003c/select>\u003cdiv class=\"block\">\u003clabel class=\"toggle\">\u003cinput id=\"talent\" type=\"checkbox\">\u003cspan>Open to Talent Opportunities\u003cbr>\u003cspan class=\"hint\">Off by default. Share your profile and resume with approved talent seekers.\u003c/span>\u003c/span>\u003c/label>\u003clabel for=\"resume-file\">\u003cspan id=\"career-label\">Resume\u003c/span> \u003cspan id=\"resume-required\" class=\"required\">\u00b7 Optional\u003c/span>\u003c/label>\u003cinput id=\"resume-file\" type=\"file\" accept=\".pdf,.docx\">\u003cp id=\"resume-name\" class=\"hint resume-label\">No file selected.\u003c/p>\u003cp class=\"hint\">PDF or DOCX, up to 5 MB. Files are not uploaded or saved.\u003c/p>\u003cbutton id=\"demo-resume\" class=\"btn text\" type=\"button\">Use sample resume for this preview\u003c/button>\u003cp class=\"hint\">Your email fields remain private. A resume may contain contact details visible to authorized viewers.\u003c/p>\u003c/div>\u003cdiv class=\"review\" id=\"review\">\u003c/div>\u003clabel class=\"toggle\">\u003cinput id=\"terms\" type=\"checkbox\">\u003cspan>I agree to the Terms of Use, Privacy Policy, and Community Guidelines, and I am 18 or older. *\u003cbr>\u003cspan class=\"hint\">Preview checkbox only. The real policies must be supplied before launch.\u003c/span>\u003c/span>\u003c/label>\u003c/section>\n\u003cdiv class=\"actions\">\u003cbutton id=\"back\" type=\"button\" class=\"btn text\">\u2190 Back\u003c/button>\u003cdiv class=\"actions-right\">\u003cbutton id=\"save\" type=\"button\" class=\"btn secondary\">Save and Continue Later\u003c/button>\u003cbutton id=\"next\" type=\"submit\" class=\"btn\">Continue \u2192\u003c/button>\u003c/div>\u003c/div>\u003c/form>\u003c/div>\n\u003csection id=\"completion\" class=\"success\" hidden>\u003cdiv class=\"success-icon\" aria-hidden=\"true\">\u2726\u003c/div>\u003cdiv class=\"eyebrow\">Preview complete\u003c/div>\u003ch2 id=\"complete-title\">You're ready to connect.\u003c/h2>\u003cp id=\"complete-description\">\u003c/p>\u003cdiv class=\"status\">Simulation only. No account, university verification, public profile, or file upload has been created.\u003c/div>\u003cbutton class=\"btn\" id=\"edit-profile\">Review my setup\u003c/button>\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">CampusTable \u00b7 Community setup design checkpoint \u00b7 Illustration-inspired palette, practical forms\u003c/footer>\u003cdiv id=\"toast\" class=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));let step=0,verified={personal:false,school:false},pending=false,sent={personal:false,school:false},resume='',evidence='',timer;const key='campustable-public-community-draft-v1';const names=['Account','Academic information','Collaboration goals','Availability and links','Privacy and review'];\n\nconst months=['January','February','March','April','May','June','July','August','September','October','November','December'];\nconst skillCatalog=['Python','JavaScript','React','UI design','UX research','Data analysis','Research','Writing','Public speaking','Project management','Graphic design','Photography','Video editing','Marketing','Excel','SQL','Docker','Kubernetes','Git','Mathematics'];\nconst skillSelections={offered:[],wanted:[]};\nfunction dateLabel(value){if(!/^\\d{4}-\\d{2}$/.test(value))return 'Select month and year';return months[Number(value.slice(5))-1]+' '+value.slice(0,4)}\nfunction syncDates(){for(let id of ['start','grad']){$('#'+id+'-trigger span').textContent=dateLabel($('#'+id).value);$$('#'+id+'-months button').forEach((b,i)=>b.setAttribute('aria-pressed',String($('#'+id).value===$('#'+id+'-year').value+'-'+String(i+1).padStart(2,'0'))))}}\nfunction closePickers(){for(let id of ['start','grad']){$('#'+id+'-calendar').hidden=true;$('#'+id+'-trigger').setAttribute('aria-expanded','false')}for(let id of ['offered','wanted']){$('#'+id+'-panel').hidden=true;$('#'+id+'-toggle').setAttribute('aria-expanded','false')}}\nfor(let id of ['start','grad']){let year=$('#'+id+'-year');for(let y=new Date().getFullYear()+20;y>=1950;y--){let o=document.createElement('option');o.value=y;o.textContent=y;year.append(o)}year.value=new Date().getFullYear();months.forEach((m,i)=>{let b=document.createElement('button');b.type='button';b.textContent=m.slice(0,3);b.setAttribute('aria-label',m);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{$('#'+id).value=year.value+'-'+String(i+1).padStart(2,'0');syncDates();closePickers();$('#'+id+'-trigger').focus()});$('#'+id+'-months').append(b)});year.addEventListener('change',syncDates);$('#'+id+'-trigger').addEventListener('click',()=>{let open=$('#'+id+'-calendar').hidden;closePickers();if(open){year.value=$('#'+id).value.slice(0,4)||new Date().getFullYear();$('#'+id+'-calendar').hidden=false;$('#'+id+'-trigger').setAttribute('aria-expanded','true');syncDates();year.focus()}})}\nfunction skillSummary(kind){return skillSelections[kind].map(s=>s.name+(role()==='faculty'&&kind==='offered'?'':' ('+(s.level||'level not selected')+')')).join(', ')}\nfunction skillOptions(kind){let q=$('#'+kind+'-search').value.trim(),list=$('#'+kind+'-options');list.replaceChildren();let choices=Array.from(new Set([...skillCatalog,...skillSelections[kind].map(s=>s.name)])).filter(name=>name.toLowerCase().includes(q.toLowerCase()));if(q&&!choices.some(n=>n.toLowerCase()===q.toLowerCase()))choices.push(q);choices.forEach(name=>{let selected=skillSelections[kind].some(s=>s.name.toLowerCase()===name.toLowerCase()),b=document.createElement('button');b.type='button';b.className='skill-choice';b.setAttribute('aria-pressed',String(selected));b.textContent=(selected?'\u2611 ':'\u2610 ')+name+(name===q&&!skillCatalog.includes(name)&&!selected?' \u00b7 Add skill':'');b.addEventListener('click',()=>{if(selected)skillSelections[kind]=skillSelections[kind].filter(s=>s.name.toLowerCase()!==name.toLowerCase());else skillSelections[kind].push({name,level:''});renderSkills(kind)});list.append(b)})}\nfunction renderSkills(kind){$('#'+kind).value=skillSelections[kind].map(s=>s.name).join(', ');let wrap=$('#'+kind+'-selected');wrap.replaceChildren();skillSelections[kind].forEach((s,i)=>{let row=docu fff}.step-tab{min-width:65px}.brand a{color:var(--ink);text-decoration:none}.review section:last-child{border-bottom:0}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"notice\">Interactive design preview \u00b7 Verification and review are simulated \u00b7 Nothing is submitted\u003c/div>\u003cheader class=\"top\">\u003ca class=\"brand\" href=\"campustable-hero.html\" aria-label=\"CampusTable home\">\u003csvg viewBox=\"0 0 40 40\" aria-hidden=\"true\">\u003cellipse cx=\"20\" cy=\"20\" rx=\"18\" ry=\"10\" transform=\"rotate(-35 20 20)\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\u003ccircle cx=\"20\" cy=\"20\" r=\"4\" fill=\"currentColor\"/>\u003c/svg>CampusTable\u003c/a>\u003ca href=\"campustable-community-setup.html\" style=\"font-size:12px\">Joining the community? \u2197\u003c/a>\u003c/header>\n\u003cmain class=\"layout\">\u003caside class=\"side\">\u003cdiv class=\"eyebrow\">A place for possibility\u003c/div>\u003ch1>Find talent.\u003cbr>See potential.\u003c/h1>\u003cp>Meet people through their skills, projects, and the work they want to do next.\u003c/p>\u003cdiv class=\"talent-scene\">\u003ch3>More than a resume.\u003c/h3>\u003cdiv class=\"mini-person\">\u003cspan class=\"avatar\">AM\u003c/span>\u003cspan>Alex Morgan\u003csmall>Student \u00b7 Python \u00b7 Project experience\u003c/small>\u003c/span>\u003c/div>\u003cdiv class=\"mini-person\">\u003cspan class=\"avatar\" style=\"background:#dff0e5\">JL\u003c/span>\u003cspan>Jordan Lee\u003csmall>Alumni \u00b7 Design \u00b7 Mentoring\u003c/small>\u003c/span>\u003c/div>\u003cp>Fictional examples \u00b7 Only members who choose talent visibility appear in discovery.\u003c/p>\u003c/div>\u003cp class=\"tip\">Your professional details are reviewed before talent access opens. A verified email alone does not verify your recruiting role.\u003c/p>\u003c/aside>\n\u003csection class=\"card\" id=\"wizard\">\u003cdiv class=\"preview-toolbar\">\u003cp>Explore every step, or try the complete flow.\u003c/p>\u003cbutton type=\"button\" class=\"btn secondary\" id=\"sample\">Use sample details\u003c/button>\u003c/div>\u003cdiv class=\"draftbar\" id=\"draftbar\" hidden>\u003cspan>A draft is saved in this browser.\u003c/span>\u003cbutton class=\"btn secondary\" id=\"restore\" type=\"button\">Resume draft\u003c/button>\u003c/div>\u003cnav class=\"step-tabs\" aria-label=\"Setup steps\">\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"0\">\u003cstrong>1\u003c/strong>Account\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"1\">\u003cstrong>2\u003c/strong>Professional\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"2\">\u003cstrong>3\u003c/strong>Preferences\u003c/button>\u003cbutton type=\"button\" class=\"step-tab\" data-jump=\"3\">\u003cstrong>4\u003c/strong>Review\u003c/button>\u003c/nav>\u003cp class=\"preview-jump-note\">Step tabs let you preview freely. Completing setup checks every required field.\u003c/p>\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003cp class=\"step-label\" id=\"step-label\">\u003c/p>\u003cdiv id=\"error\" class=\"status error\" role=\"alert\" hidden>\u003c/div>\n\u003cform novalidate id=\"setup\" novalidate>\n\u003csection data-step=\"0\">\u003ch2>Let\u2019s start with you.\u003c/h2>\u003cp class=\"subtitle\">Your account email keeps you connected. It can also be your work email.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"first\">First Name *\u003c/label>\u003cinput id=\"first\" autocomplete=\"given-name\" required>\u003c/div>\u003cdiv>\u003clabel for=\"last\">Last Name *\u003c/label>\u003cinput id=\"last\" autocomplete=\"family-name\" required>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"account\">Account Email *\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"account\" type=\"email\" autocomplete=\"email\" required placeholder=\"you@company.com\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"verify-account\">Verify email\u003c/button>\u003c/div>\u003cp class=\"hint\" id=\"account-status\">Email stays private.\u003c/p>\u003cdiv class=\"otp\" id=\"account-otp\" hidden>\u003clabel for=\"account-code\">Verification Code\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"account-code\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"123456\">\u003cbutton type=\"button\" class=\"btn\" id=\"confirm-account\">Confirm\u003c/button>\u003c/div>\u003cp class=\"hint\">Preview code: 123456. No email is sent.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\n\u003csection data-step=\"1\" hidden>\u003ch2>Tell us about your work.\u003c/h2>\u003cp class=\"subtitle\">A little context helps us review who you recruit for.\u003c/p>\u003cdiv class=\"fields\">\u003cdiv class=\"full\">\u003clabel for=\"type\">Recruiter Type *\u003c/label>\u003cselect id=\"type\" required>\u003coption value=\"\">Select recruiter type\u003c/option>\u003coption>Company / Employer\u003c/option>\u003coption>Recruiting Agency\u003c/option>\u003coption>Independent Recruiter\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"full\" id=\"organization-fields\">\u003cdiv class=\"fields\">\u003cdiv>\u003clabel for=\"organization\">Organization Name *\u003c/label>\u003cinput id=\"organization\" required autocomplete=\"organization\">\u003c/div>\u003cdiv>\u003clabel for=\"website\">Organization Website *\u003c/label>\u003cinput id=\"website\" type=\"url\" required placeholder=\"https://company.com\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"title\">Position / Title *\u003c/label>\u003cinput id=\"title\" required autocomplete=\"organization-title\">\u003c/div>\u003cdiv class=\"full\">\u003clabel class=\"toggle\">\u003cinput type=\"checkbox\" id=\"same\" checked>Use my account email as my work email\u003c/label>\u003cdiv id=\"work-fields\" hidden>\u003clabel for=\"work\" id=\"work-label\">Work Email *\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"work\" type=\"email\" placeholder=\"you@company.com\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"verify-work\">Verify email\u003c/button>\u003c/div>\u003cdiv class=\"otp\" id=\"work-otp\" hidden>\u003clabel for=\"work-code\">Verification Code\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"work-code\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"123456\">\u003cbutton type=\"button\" class=\"btn\" id=\"confirm-work\">Confirm\u003c/button>\u003c/div>\u003cp class=\"hint\">Preview code: 123456.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"hint\" id=\"work-status\">\u003c/p>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"profile\" id=\"profile-label\">Professional Profile (optional)\u003c/label>\u003cinput id=\"profile\" type=\"url\" placeholder=\"LinkedIn or another professional profile URL\">\u003cp class=\"hint\">Independent recruiters need a professional profile for manual review.\u003c/p>\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"about\">About Your Work *\u003c/label>\u003ctextarea id=\"about\" required placeholder=\"Who do you recruit for, and what kinds of opportunities do you offer?\">\u003c/textarea>\u003c/div>\u003c/div>\u003cdiv class=\"status warn\">Email verification confirms mailbox access. Your organization and recruiting role still need review.\u003c/div>\u003c/section>\n\u003csection data-step=\"2\" hidden>\u003ch2>Who are you looking for?\u003c/h2>\u003cp class=\"subtitle\">Set discovery preferences. You can adjust them later.\u003c/p>\u003cfieldset>\u003clegend>Looking For *\u003c/legend>\u003cdiv class=\"options\">\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"looking\" value=\"Internships\">Internships\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"looking\" value=\"Full-time Roles\">Full-time Roles\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"looking\" value=\"Part-time Roles\">Part-time Roles\u003c/label>\u003clabel class=\"option\">\u003cinput type=\"checkbox\" name=\"looking\" value=\"Contract / Freelance Work\">Contract / Freelance Work\u003c/label>\u003c/div>\u003c/fieldset>\u003cdiv class=\"block\">\u003ch3>Skills / Areas of Interest *\u003c/h3>\u003cp>Select multiple skills or add a specific area.\u003c/p>\u003clabel for=\"skill-search\">Search or add a skill\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"skill-search\" placeholder=\"Try design, research, or Python\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"add-skill\">Add\u003c/button>\u003c/div>\u003cdiv class=\"chips\" id=\"selected-skills\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"skill-list\" id=\"skill-list\">\u003c/div>\u003c/div>\u003cdiv class=\"fields\">\u003cdiv class=\"full\">\u003clabel for=\"opportunity\">Opportunity Description *\u003c/label>\u003ctextarea id=\"opportunity\" required placeholder=\"Describe the work, responsibilities, and experience you are looking for.\">\u003c/textarea>\u003c/div>\u003cdiv>\u003clabel for=\"arrangement\">Work Arrangement *\u003c/label>\u003cselect id=\"arrangement\" required>\u003coption value=\"\">Select arrangement\u003c/option>\u003coption>Remote\u003c/option>\u003coption>In person\u003c/option>\u003coption>Hybrid\u003c/option>\u003coption>Flexible\u003c/option>\u003c/select>\u003c/div>\u003cdiv>\u003clabel for=\"location\" id=\"location-label\">Location (optional)\u003c/label>\u003cinput id=\"location\" placeholder=\"City or region\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"university-pref\">University Preference\u003c/label>\u003cselect id=\"university-pref\">\u003coption>All participating universities\u003c/option>\u003coption>Selected universities\u003c/option>\u003c/select>\u003c/div>\u003cdiv class=\"full\" id=\"universities-wrap\" hidden>\u003clabel for=\"universities\">Selected Universities *\u003c/label>\u003cinput id=\"universities\" placeholder=\"University names, separated by commas\">\u003c/div>\u003cdiv class=\"full\">\u003clabel for=\"programs\">Degree / Program Preferences (optional)\u003c/label>\u003cinput id=\"programs\" type=\"hidden\">\u003cdetails class=\"extra\">\u003csummary>Select degree levels and programs\u003c/summary>\u003clabel for=\"program-search\" style=\"margin-top:12px\">Search or add a preference\u003c/label>\u003cdiv class=\"inline\">\u003cinput id=\"program-search\" placeholder=\"Try Computer Science\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"add-program\">Add\u003c/button>\u003c/div>\u003cdiv class=\"skill-list\" id=\"program-list\">\u003c/div>\u003c/details>\u003cdiv id=\"program-chips\" class=\"chips\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cdiv>\u003clabel for=\"grad-from\">Graduation From (optional)\u003c/label>\u003cinput type=\"month\" id=\"grad-from\">\u003c/div>\u003cdiv>\u003clabel for=\"grad-to\">Graduation To (optional)\u003c/label>\u003cinput type=\"month\" id=\"grad-to\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection data-step=\"3\" hidden>\u003ch2>Review your recruiter profile.\u003c/h2>\u003cp class=\"subtitle\">Check your details before requesting access.\u003c/p>\u003cdiv id=\"review\" class=\"review\">\u003c/div>\u003cdiv class=\"status warn\">Review comes first. Talent discovery opens after approval and includes only members who opted in.\u003c/div>\u003clabel class=\"toggle\">\u003cinput type=\"checkbox\" id=\"terms\">I agree to the Terms of Use, Privacy Policy, and Community Guidelines, and I am 18 or older. *\u003c/label>\u003clabel class=\"toggle\">\u003cinput type=\"checkbox\" id=\"consent\">I confirm these professional details are accurate and agree to respectful outreach. *\u003c/label>\u003cp class=\"hint\">Preview acknowledgments only. Legal documents will be provided before launch.\u003c/p>\u003c/section>\n\u003cdiv class=\"actions\">\u003cbutton type=\"button\" class=\"btn text\" id=\"save\">Save and continue later\u003c/button>\u003cdiv class=\"actions-right\">\u003cbutton type=\"button\" class=\"btn secondary\" id=\"back\">Back\u003c/button>\u003cbutton class=\"btn\" id=\"next\" type=\"submit\">Continue \u2192\u003c/button>\u003c/div>\u003c/div>\u003c/form>\u003cp class=\"hint\">* Required. Drafts stay in this browser and exclude verification codes.\u003c/p>\u003c/section>\n\u003csection class=\"card success\" id=\"completion\" hidden>\u003cdiv class=\"success-icon\">\u2713\u003c/div>\u003cdiv class=\"eyebrow\">Preview complete\u003c/div>\u003ch2>Your profile is ready for review.\u003c/h2>\u003cp>No application was submitted. In the live product, your recruiter access would stay pending until your professional details are approved.\u003c/p>\u003cdiv class=\"status warn\">Talent discovery: pending approval\u003c/div>\u003cbutton type=\"button\" class=\"btn secondary\" id=\"edit\">Review details\u003c/button>\u003cp>\u003ca href=\"campustable-hero.html\">Back to CampusTable\u003c/a>\u003c/p>\u003c/section>\u003c/main>\u003cfooter class=\"footer\">CampusTable \u00b7 Different skills. Shared possibilities.\u003c/footer>\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" hidden>\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let step=0,verified={account:false,work:false},skills=[],timer;const key='campustable-recruiter-draft-v1',names=['Account','Professional','Preferences','Review'],catalog=['Python','JavaScript','TypeScript','React','Data analysis','Machine learning','Cloud infrastructure','DevOps','UI design','UX research','Graphic design','Writing','Marketing','Business analysis','Project management','Research','Engineering','Public health'];\nfunction toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500)}\nfunction error(t,e){$('#error').textContent=t;$('#error').hidden=false;if(e)e.focus();return false}\nfunction sync(){const independent=$('#type').value==='Independent Recruiter';$('#organization-fields').hidden=independent;$('#organization').required=$('#website').required=!independent;$('#profile').required=independent;$('#profile-label').textContent=independent?'Professional Profile *':'Professional Profile (optional)';$('#work-label').textContent=independent?'Work Email (optional)':'Work Email *';$('#work-fields').hidden=$('#same').checked;$('#work').required=!independent&&!$('#same').checked;$('#work-status').textContent=$('#same').checked?(verified.account?'Uses your verified account email.':'Verify your account email in step 1.'):(verified.work?'Work email verified (simulated).':'Work email stays private.');$('#account-status').textContent=verified.account?'Account email verified (simulated).':'Email stays private.';const local=['In person','Hybrid'].includes($('#arrangement').value);$('#location').required=local;$('#location-label').textContent=local?'Location *':'Location (optional)';const selected=$('#university-pref').value==='Selected universities';$('#universities-wrap').hidden=!selected;$('#universities').required=selected;}\nfunction renderSkills(){const q=$('#skill-search').value.trim().toLowerCase();$('#skill-list').replaceChildren();catalog.filter(x=>x.toLowerCase().includes(q)).forEach(x=>{const b=document.createElement('button');b.type='button';b.className='skill-choice';b.textContent=x;b.setAttribute('aria-pressed',String(skills.includes(x)));b.onclick=()=>{skills=skills.includes(x)?skills.filter(v=>v!==x):[...skills,x];renderSkills()};$('#skill-list').append(b)});$('#selected-skills').replaceChildren();skills.forEach(x=>{const s=document.createElement('span');s.className='chip';s.append(document.createTextNode(x));const b=document.createElement('button');b.type='button';b.textContent='\u00d7';b.setAttribute('aria-label','Remove '+x);b.onclick=()=>{skills=skills.filter(v=>v!==x);renderSkills()};s.append(b);$('#selected-skills').append(s)})}\nfunction review(){const rows=[['Account',[$('#first').value+' '+$('#last').value,$('#account').value,verified.account?'Email verified (simulated)':'Email not verified'],0],['Professional details',[$('#type').value,$('#organization-fields').hidden?'Independent recruiter':$('#organization').value,$('#title').value,$('#profile').value,$('#about').value],1],['Hiring preferences',[$$('input[name=looking]:checked').map(x=>x.value).join(', '),skills.join(', '),$('#opportunity').value,$('#arrangement').value,$('#location').value,$('#university-pref').value==='Selected universities'?$('#universities').value:$('#university-pref').value,$('#programs').value,[$('#grad-from').value,$('#grad-to').value].filter(Boolean).join(' to ')],2]];$('#review').replaceChildren();rows.forEach(([title,lines,n])=>{const s=document.createElement('section'),head=document.createElement('div'),h=document.createElement('h3'),b=document.createElement('button');head.className='review-head';h.textContent=title;b.type='button';b.className='btn text';b.textContent='Edit';b.onclick=()=>show(n);head.append(h,b);s.append(head);lines.filter(Boolean).forEach(t=>{const p=document.createElement('p');p.textContent=t;s.append(p)});$('#review').append(s)})}\nfunction show(n){step=n;$('#error').hidden=true;sync();$$('[data-step]').forEach((x,i)=>x.hidden=i!==n);$$('[data-jump]').forEach((b,i)=>{if(i===n)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$$('.progress span').forEach((x,i)=>x.classList.toggle('done',i\u003c=n));$('#step-label').textContent='Step '+(n+1)+' of 4 \u00b7 '+names[n];$('#back').hidden=n===0;$('#next').textContent=n===3?'Request review (preview)':'Continue \u2192';if(n===3)review();window.scrollTo(0,0)}\nfunction check(n){sync();for(const e of $$('[data-step=\"'+n+'\"] input,[data-step=\"'+n+'\"] select,[data-step=\"'+n+'\"] textarea')){if(e.closest('[hidden]')||['account-code','work-code'].includes(e.id))continue;if(e.required&&!e.value.trim())return error('Complete '+(document.querySelector('label[for=\"'+e.id+'\"]')?.textContent||'the required field')+'.',e);if(['url','email'].includes(e.type)&&e.value&&!e.checkValidity())return error('Enter a valid '+e.type+'.',e)}for(const e of $$('[data-step=\"'+n+'\"] input[type=url]')){if(!e.closest('[hidden]')&&e.value){try{const u=new URL(e.value);if(!['http:','https:'].includes(u.protocol)||!u.hostname.includes('.'))throw Error()}catch{return error('Enter a full website URL beginning with https://.',e)}}}if(n===0&&!verified.account)return error('Verify your account email to continue.',$('#account'));if(n===1&&!$('#same').checked&&$('#work').value&&!verified.work)return error('Verify the work email you entered.',$('#work'));if(n===2){if(!$$('input[name=looking]:checked').length)return error('Select at least one opportunity type.');if(!skills.length)return error('Select at least one skill or area of interest.',$('#skill-search'));if($('#grad-from').value&&$('#grad-to').value&&$('#grad-from').value>$('#grad-to').value)return error('Graduation To must be the same month or later than Graduation From.',$('#grad-to'))}if(n===3&&(!$('#terms').checked||!$('#consent').checked))return error('Confirm both acknowledgments to request review.');return true}\nfor(const kind of ['account','work']){$('#verify-'+kind).onclick=()=>{const e=$('#'+kind);if(!e.value||!e.checkValidity())return error('Enter a valid email first.',e);$('#'+kind+'-otp').hidden=false;toast('Preview only: enter 123456.')};$('#confirm-'+kind).onclick=()=>{if($('#'+kind+'-code').value!=='123456')return error('Use the preview code 123456.',$('#'+kind+'-code'));verified[kind]=true;$('#'+kind+'-otp').hidden=true;$('#error').hidden=true;sync()};$('#'+kind).oninput=()=>{verified[kind]=false;$('#'+kind+'-otp').hidden=true;sync()}}\n['type','same','arrangement','university-pref'].forEach(id=>$('#'+id).onchange=sync);$('#skill-search').oninput=renderSkills;$('#add-skill').onclick=()=>{const v=$('#skill-search').value.trim().slice(0,70);if(!v)return;if(!skills.some(x=>x.toLowerCase()===v.toLowerCase()))skills.push(v);$('#skill-search').value='';renderSkills()};$('#skill-search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#add-skill').click()}};\n$('#setup').onsubmit=e=>{e.preventDefault();$('#error').hidden=true;if(!check(step))return;if(step\u003c3)return show(step+1);for(let n=0;n\u003c3;n++){show(n);if(!check(n))return}show(3);$('#wizard').hidden=true;$('#completion').hidden=false;window.scrollTo(0,0)};$('#back').onclick=()=>show(Math.max(0,step-1));$$('[data-jump]').forEach(b=>b.onclick=()=>show(Number(b.dataset.jump)));$('#edit').onclick=()=>{$('#wizard').hidden=false;$('#completion').hidden=true;show(3)};\n$('#save').onclick=()=>{const values={};$$('#setup input,#setup textarea,#setup select').forEach(e=>{if(!e.id||e.id.endsWith('-code'))return;values[e.id]=e.type==='checkbox'?e.checked:e.value});try{localStorage.setItem(key,JSON.stringify({values,skills,looking:$$('input[name=looking]:checked').map(e=>e.value)}));$('#draftbar').hidden=false;toast('Draft saved here. Email verification must be repeated after restoring.')}catch{toast('Browser storage is unavailable. Keep this page open.')}};$('#restore').onclick=()=>{try{const d=JSON.parse(localStorage.getItem(key));if(!d?.values)throw Error();Object.entries(d.values).forEach(([id,v])=>{const e=$('#'+id);if(e)e.type==='checkbox'?e.checked=Boolean(v):e.value=v});$$('input[name=looking]').forEach(e=>e.checked=d.looking?.includes(e.value));skills=Array.isArray(d.skills)?d.skills:[];verified={account:false,work:false};$('#account-code').value=$('#work-code').value='';$('#account-otp').hidden=$('#work-otp').hidden=true;$('#completion').hidden=true;$('#wizard').hidden=false;renderSkills();renderPrograms();show(0);toast('Draft restored. Verify emails again.')}catch{toast('Draft could not be restored.')}};\n\nconst programCatalog=[\"Bachelor's Degree\",\"Master's Degree\",\"Doctoral Degree\",'Computer Science','Engineering','Design','Business','Health Sciences','Social Sciences','Arts and Humanities'];\nfunction programValues(){return $('#programs').value.split(',').map(x=>x.trim()).filter(Boolean)}\nfunction renderPrograms(){const picked=programValues(),q=$('#program-search').value.toLowerCase().trim();$('#program-list').replaceChildren();programCatalog.filter(x=>x.toLowerCase().includes(q)).forEach(x=>{const b=document.createElement('button');b.type='button';b.className='skill-choice';b.textContent=x;b.setAttribute('aria-pressed',String(picked.includes(x)));b.onclick=()=>{$('#programs').value=(picked.includes(x)?picked.filter(v=>v!==x):[...picked,x]).join(', ');renderPrograms()};$('#program-list').append(b)});$('#program-chips').replaceChildren();picked.forEach(x=>{const s=document.createElement('span');s.className='chip';s.textContent=x;const b=document.createElement('button');b.type='button';b.textContent='\u00d7';b.setAttribute('aria-label','Remove '+x);b.onclick=()=>{$('#programs').value=programValues().filter(v=>v!==x).join(', ');renderPrograms()};s.append(b);$('#program-chips').append(s)})}\n$('#program-search').oninput=renderPrograms;$('#add-program').onclick=()=>{const v=$('#program-search').value.trim().replaceAll(',',' ').slice(0,70),values=programValues();if(v&&!values.some(x=>x.toLowerCase()===v.toLowerCase()))values.push(v);$('#programs').value=values.join(', ');$('#program-search').value='';renderPrograms()};$('#program-search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#add-program').click()}};\n$('#sample').onclick=()=>{$('#setup').reset();const data={first:'Sam',last:'Rivera',account:'sam@example.com',type:'Company / Employer',organization:'Example Studio',website:'https://example.com',title:'Talent Partner',about:'I help our team recruit for student internships and early-career opportunities.',opportunity:'Looking for collaborators with Python and design experience for paid internship roles.',arrangement:'Remote',location:'',profile:'',programs:''};Object.entries(data).forEach(([id,v])=>$('#'+id).value=v);$('#same').c function detail(id){const p=member(id);if(!p||isRecruiter()&&!p.talent)return emptyPage('Profile unavailable.','This profile is not shared with talent seekers.');const pProjects=visibleProjects().filter(x=>x.team.includes(id));return '<section class="page"><button class="btn text small" data-action="nav" data-id="'+(isRecruiter()?'talent':'people')+'">← Back to '+(isRecruiter()?'talent':'people')+'</button><div class="detail-layout" style="margin-top:18px"><div><div class="detail-hero"><div class="person-line"><span class="avatar '+p.color+'">'+esc(initials(p.name))+'</span><div><span class="pill">'+p.role+'</span><h2>'+esc(p.name)+'</h2><div class="row-meta">'+esc(p.major)+' · '+esc(p.university)+'</div></div></div><span class="pill mint">'+esc(p.status||'Fictional profile')+'</span></div><article class="card">'+(!isRecruiter()?'<h3>What brings me here</h3><p class="detail-copy">'+esc(p.about)+'</p>':'')+'<h3 style="margin-top:24px">Skills I can help with</h3>'+tags(p.skills||[])+'<p class="tiny">Skills are self-reported. Sample profiles do not imply verified expertise.</p>'+(!isRecruiter()&&(p.wants||[]).length?'<h3 style="margin-top:24px">Skills I want to learn</h3>'+tags(p.wants):'')+'</article><article class="card"><h3>Projects and shared work</h3>'+(pProjects.length?pProjects.map(x=>'<div class="milestone"><strong>'+esc(x.title)+'</strong><p>'+esc(x.status)+' · '+esc(x.description)+'</p><button class="btn text small" data-action="project-detail" data-id="'+x.id+'">Explore project →</button></div>').join(''):'<p>No shared projects in this fictional profile yet.</p>')+'</article></div><aside><article class="card"><div class="eyebrow">A reason to connect</div><h3 style="margin-top:10px">'+(isRecruiter()?'Start with their work.':'Bring a goal, not just a hello.')+'</h3>'+(!isRecruiter()?'<p>'+esc(p.availability)+'<br>'+esc(p.meeting)+'</p>':'')+''+requestButton(p)+'<p class="tiny" style="margin-top:15px">One introduction before acceptance. A conversation opens after the request is accepted.</p></article><article class="card"><h3>Background</h3><div class="facts"><div><strong>Program / position</strong><span>'+esc(p.degree)+'</span></div><div><strong>Graduation</strong><span>'+esc(p.graduation)+'</span></div></div></article>'+(isRecruiter()?'<article class="card"><h3>Talent profile</h3><span class="pill mint">Talent visibility: on · Demo</span><div class="actions"><button class="btn secondary small" data-action="resume" data-id="'+p.id+'">View sample resume</button><button class="btn text small" data-action="shortlist" data-id="'+p.id+'">'+(shortlist.includes(p.id)?'★ Shortlisted':'☆ Add to shortlist')+'</button></div></article>':'')+'</aside></div></section>'}

function projectsPage(){const list=visibleProjects().filter(p=>(!projectFilter.query||[p.title,p.description,...p.needs].join(' ').toLowerCase().includes(projectFilter.query.toLowerCase()))&&(!projectFilter.status||p.status===projectFilter.status));return '<section class="page"><div class="page-head"><div><div class="eyebrow">Your next chapter</div><h2>Ideas need people.</h2><p>Find a project where your contribution matters—or share what you want to build.</p></div>'+(!isRecruiter()?'<button class="btn" data-action="new-project">Start a project ↗</button>':'')+'</div><div class="search-panel" style="grid-template-columns:2fr 1fr"><div><label for="project-query">Search projects or skills</label><input id="project-query" value="'+esc(projectFilter.query)+'" placeholder="Try React or sustainability"></div><div><label for="project-status">Project stage</label><select id="project-status"><option value="">All stages</option>'+['Idea','Recruiting','In progress','Completed'].map(x=>'<option '+(x===projectFilter.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><p class="result-count">'+list.length+' fictional projects</p><div class="cards">'+(list.length?list.map(projectCard).join(''):'<div class="empty full"><h3>No projects match.</h3><p>Try another skill or stage.</p><button class="btn secondary" data-action="clear-projects">Clear filters</button></div>')+'</div></section>'}
function projectDetail(id){const p=visibleProjects().find(x=>x.id===id);if(!p)return emptyPage('Project unavailable.','This project is not visible in this demo role.');const owner=member(p.owner),mine=p.owner===actor.id;return '<section class="page"><button class="btn text small" data-action="nav" data-id="'+(isRecruiter()?'talent':'projects')+'">← Back to '+(isRecruiter()?'talent':'projects')+'</button><div class="detail-layout" style="margin-top:18px"><div><div class="detail-hero"><span class="pill">'+esc(p.status)+'</span><h2>'+esc(p.title)+'</h2><div class="row-meta">'+esc(p.university)+' · Led by '+esc(owner?.name||actor.name)+'</div></div><article class="card"><h3>What we want to build</h3><p class="detail-copy">'+esc(p.description)+'</p><h3 style="margin-top:22px">Help we need</h3>'+tags(p.needs)+'<h3 style="margin-top:22px">What we bring</h3><p>'+esc(p.contribution)+'</p></article><article class="card"><div class="flex-between"><h3>Progress and contributions</h3>'+(mine?'<button class="btn text small" data-action="milestone" data-id="'+p.id+'">Add update</button>':'')+'</div>'+p.milestones.map(t=>'<div class="milestone"><strong>'+esc(t)+'</strong><p>Fictional demo update</p></div>').join('')+'</article></div><aside><article class="card"><h3>Build with this team</h3>'+(!isRecruiter()?'<p>'+esc(p.meeting)+'<br>'+esc(p.hours)+'</p>':'')+''+(mine?'<label class="label" for="change-stage">Project stage</label><select id="change-stage" data-project="'+p.id+'">'+['Idea','Recruiting','In progress','Completed'].map(x=>'<option '+(x===p.status?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn secondary small" style="margin-top:15px" data-action="add-collaborator" data-id="'+p.id+'">Add connected collaborator</button>':p.status==='Completed'?'<span class="pill mint">Completed · View shared work</span>':isRecruiter()?'<button class="btn secondary" data-action="detail" data-id="'+p.owner+'">View talent profile</button>':'<button class="btn" data-action="project-request" data-id="'+p.id+'">Offer to collaborate ↗</button>')+'</article><article class="card"><h3>People behind the project</h3>'+p.team.filter(x=>!isRecruiter()||member(x)?.talent).map(id=>{const t=member(id);return '<button class="btn text small" data-action="detail" data-id="'+id+'">'+esc(t?.name||actor.name)+' →</button><br>'}).join('')+'</article></aside></div></section>'}
function emptyPage(title,text){return '<section class="page"><div class="empty"><h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><button class="btn secondary" data-action="nav" data-id="'+(isRecruiter()?'talent':'people')+'">Explore people</button></div></section>'}
function requestDialog(id,projectId){if(!ensure())return;const p=member(id);if(!p||isRecruiter()&&!p.talent)return toast('This member has not shared their profile with talent seekers.');if(id===actor.id)return toast('This is your own project. Invite a connected collaborator instead.');const r=connection(id);if(r){navigate(r.status==='accepted'?'messages/'+r.id:'requests');return}const proj=projects.find(x=>x.id===projectId);openDialog(isRecruiter()?'Request a conversation.':'Start with a shared goal.','<p class="muted">To '+esc(p.name)+(proj?' · '+esc(proj.title):'')+'</p><div class="notice">You can send one introduction. Further messages unlock after acceptance.</div><form id="request-form" data-person="'+id+'" data-project="'+(projectId||'')+'"><label class="label" for="intro">Your introduction *</label><textarea id="intro" required maxlength="600" placeholder="What would you like to learn, offer, or build together?"></textarea><p class="tiny">Demo limit: 600 characters. No real message is sent.</p><button type="button" class="btn text small" data-action="sample-intro" data-id="'+id+'">Use sample introduction</button><div id="request-error" class="error" hidden role="alert"></div><div class="actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn">Send demo introduction ↗</button></div></form>')}
function requestsPage(){const list=myRequests().filter(r=>requestTab==='all'||requestStatus(r)===requestTab);return '<section class="page"><div class="page-head"><div><div class="eyebrow">Connections with a purpose</div><h2>A little context goes a long way.</h2><p>One introduction. A clear reason to connect. A conversation when both people agree.</p></div><button class="btn secondary small" data-action="incoming">Try an incoming request</button></div><div class="tabs">'+['all','pending','accepted','declined','withdrawn'].map(x=>'<button data-action="request-tab" data-id="'+x+'" class="'+(requestTab===x?'active':'')+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div><div class="list">'+(list.length?list.map(r=>{const p=other(r),outgoing=r.from===actor.id,status=requestStatus(r);return '<article class="card request-card"><div><div class="person-line"><span class="avatar '+(p.color||'')+'">'+esc(initials(p.name))+'</span><div><h3>'+esc(p.name)+'</h3><small>'+(outgoing?'Sent by you':'Received')+' · '+(r.project?esc(projects.find(x=>x.id===r.project)?.title||'Project collaboration'):'Introduction')+'</small></div></div><span class="pill '+(r.status==='accepted'?'mint':'gold')+'">'+status+'</span><blockquote>'+esc(r.intro)+'</blockquote><p class="tiny">'+(status==='pending'?'More messages unlock only after acceptance.':'No real request or notification was sent.')+'</p></div><div class="actions">'+(r.status==='pending'?(outgoing?'<button class="btn secondary small" data-action="accept" data-id="'+r.id+'">Simulate acceptance</button><button class="btn text small" data-action="decline" data-id="'+r.id+'">Simulate decline</button><button class="btn text small" data-action="withdraw" data-id="'+r.id+'">Withdraw</button>':'<button class="btn small" data-action="accept" data-id="'+r.id+'">Accept</button><button class="btn secondary small" data-action="decline" data-id="'+r.id+'">Decline</button>'):outgoing&&r.status==='declined'?'<button class="btn text small" data-action="withdraw" data-id="'+r.id+'">Withdraw</button>':r.status==='accepted'?'<button class="btn small" data-action="conversation" data-id="'+r.id+'">Open conversation</button>':'')+'</div></article>'}).join(''):'<div class="empty"><h3>No '+(requestTab==='all'?'':requestTab+' ')+'requests yet.</h3><p>Find someone with a shared goal and send a thoughtful introduction.</p><button class="btn secondary" data-action="nav" data-id="'+(isRecruiter()?'talent':'people')+'">Explore profiles</button></div>')+'</div></section>'}
function messagesPage(id){const list=myRequests().filter(r=>r.status==='accepted');let r=list.find(x=>x.id===id)||list.find(x=>x.id===chatId)||list[0];if(!r)return emptyPage('Your conversation starts after acceptance.','Send an introduction, then accept an incoming request or simulate the recipient’s acceptance.');chatId=r.id;const p=other(r);return '<section class="page"><div class="page-head"><div><div class="eyebrow">Build together</div><h2>From an introduction to real work.</h2><p>Fictional conversations demonstrate the accepted-connection flow.</p></div></div><div class="chat-layout"><aside class="chat-list">'+list.map(x=>'<button class="'+(x.id===r.id?'active':'')+'" data-action="conversation" data-id="'+x.id+'"><strong>'+esc(other(x).name)+'</strong><br><small class="muted">Connected · Demo conversation</small></button>').join('')+'</aside><article class="card chat-card"><div class="chat-top"><div><h3>'+esc(p.name)+'</h3><span class="tiny">'+esc(p.role)+' · Accepted connection</span></div><button class="btn text small" data-action="outcome" data-id="'+r.id+'">Record a useful interaction</button></div><div class="chat-feed" id="chat-feed">'+r.messages.map(m=>'<div class="bubble '+(m.from===actor.id?'mine':'')+'"><div class="tiny" style="color:inherit;opacity:.7">'+esc(m.from===actor.id?'You':p.name)+' · Demo</div>'+esc(m.text)+'</div>').join('')+'</div><div class="actions"><button class="btn text small" data-action="sample-reply" data-id="'+r.id+'">Simulate '+esc(p.name.split(' ')[0])+'’s reply</button></div><form id="chat-form" class="chat-form" data-id="'+r.id+'"><label class="sr-only" for="chat-message">Your demo message</label><textarea id="chat-message" maxlength="1000" required placeholder="Discuss a goal, next step, or time to collaborate…"></textarea><button class="btn small">Send</button></form><p class="tiny" style="margin:12px 0 0">Messages stay in this tab only. No delivery, AI generation, or email notification.</p></article></div></section>'}
function shortlistPage(){if(!isRecruiter())return emptyPage('Recruiter view.','Switch to the recruiter persona to explore talent discovery.');const list=visibleMembers().filter(p=>shortlist.includes(p.id));return '<section class="page"><div class="page-head"><div><div class="eyebrow">Talent you want to remember</div><h2>Your shortlist.</h2><p>Save opted-in fictional profiles, then start a conversation with context.</p></div><button class="btn secondary small" data-action="nav" data-id="talent">Explore talent</button></div><div class="cards">'+(list.length?list.map(personCard).join(''):'<div class="empty full"><h3>Your shortlist is empty.</h3><p>Open a talent profile and select Add to shortlist.</p></div>')+'</div></section>'}
function profilePage(){const done=outcomes.filter(o=>o.actor===actor.id);return '<section class="page"><div class="page-head"><div><div class="eyebrow">Your place at the table</div><h2>'+esc(actor.name)+'</h2><p>'+actor.role+' · '+esc(actor.university||actor.organization)+'</p></div><button class="btn secondary small" data-action="edit-profile">Edit demo profile</button></div><div class="detail-layout"><div><article class="card"><h3>What brings me here</h3><p>'+esc(actor.about)+'</p><h3>Skills I can help with</h3>'+tags(actor.skills||[])+'<h3>Skills I want to learn</h3>'+tags(actor.wants||[])+'<p class="tiny">Everything in this profile is fictional. Demo edits are temporary.</p></article><article class="card"><h3>Useful interactions</h3>'+(done.length?done.map(o=>'<div class="milestone"><strong>'+esc(o.type)+' with '+esc(member(o.person)?.name)+'</strong><p>'+esc(o.text)+'</p></div>').join(''):'<p>After a conversation, record what you learned or contributed. An accepted connection alone is not a completed collaboration.</p>')+'</article></div><aside><article class="card"><h3>'+ (isRecruiter()?'Recruiter review':'Visibility')+'</h3><span class="pill '+(canBrowse()?'mint':'gold')+'">'+(canBrowse()?'Sample account active':'Review pending')+'</span>'+(!isRecruiter()?'<p>Talent visibility: <strong>'+(actor.talent?'On':'Off')+'</strong></p><p class="tiny">A sample resume is required to turn talent visibility on in this demo.</p>':'<p class="tiny">Your discovery view contains only opted-in sample profiles.</p><button class="btn secondary small" data-action="pending">Try pending-review state</button>')+'</article><article class="card"><h3>Explore your setup</h3><p>Try the approved role-specific onboarding forms.</p><button class="btn secondary small" data-action="nav" data-id="'+(isRecruiter()?'recruiter-setup':'join')+'">Open setup preview</button></article></aside></div></section>'}

function render(){lastRenderedHash=location.hash;const hash=location.hash.slice(1)||'home',[route,id]=hash.split('/');nav();$('#navigation').classList.remove('open');$('.menu-toggle').setAttribute('aria-expanded','false');let content;if(['home','how','try'].includes(route))content=home();else if(['join','recruiter-setup'].includes(route))content=setupPage(route==='recruiter-setup');else if(!actor){content=home()}else if(!canBrowse()&&route!=='profile')content=reviewPage();else if(['people','talent'].includes(route))content=peoplePage();else if(route==='person')content=detail(id);else if(route==='projects')content=projectsPage();else if(route==='project')content=projectDetail(id);else if(route==='requests')content=requestsPage();else if(route==='messages')content=messagesPage(id);else if(route==='shortlist')content=shortlistPage();else if(route==='profile')content=profilePage();else if(route==='review')content=reviewPage();else content=home();$('#main').innerHTML=content;document.title='CampusTable · '+(route==='home'?'Interactive demo':route[0].toUpperCase()+route.slice(1));if($('#results')){$('#role-filter').value=filters.role;renderResults()}if($('#setup-frame'))$('#setup-frame').srcdoc=route==='recruiter-setup'?recruiterSetup:communitySetup;if(route==='try'||route==='how')setTimeout(()=>$('#'+route)?.scrollIntoView({behavior:'smooth',block:'start'}),50);else window.scrollTo(0,0)}
